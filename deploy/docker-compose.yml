# 学生家长工作台 · 单机部署
# 前置：./api 放 server 目录内容（含 Dockerfile）、./web 放 parents-vue/dist 内容
# 启动：docker compose up -d --build

name: workstation-parents

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --slow-query-log=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-workstation_parents}
      MYSQL_USER: ${DB_USER:-parents_app}
      MYSQL_PASSWORD: ${DB_PASS:?请在 .env 里设置 DB_PASS}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    # 2G 机器：768m(db) + 512m(api) + 128m(web) = 1.4G，留 600M 给系统
    # buffer pool 固定 256M，实际常驻 350-450M，768m 余量充足
    # 若换成 4G 及以上机器，可调回 1g
    mem_limit: 768m
    # 端口不对外暴露：只有 api 容器能通过内部网络访问 3306

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-parents_app}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-workstation_parents}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    mem_limit: 128m

volumes:
  db-data:
